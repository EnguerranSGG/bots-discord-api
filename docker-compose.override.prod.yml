services:
  # API 
  api:
    container_name: api-discord-prod
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    image: api-discord:prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
    command: sh -c "node dist/src/common/services/seed.service.js && node dist/src/main.js"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs/api:/app/logs
      - ./logs/api:/var/log/api
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Nginx
  nginx:
    container_name: nginx-discord-prod
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # BOT
  bot:
    container_name: bot-discord-prod
    build:
      context: ../bot-discord-onboarding
      dockerfile: Dockerfile.prod
    image: bot-discord:prod
    restart: unless-stopped
    env_file:
      - ../bot-discord-onboarding/.env.production
    environment:
      - NODE_ENV=production
      - API_URL=http://api:3000
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./logs/bot:/app/logs
      - ./logs/bot:/var/log/bot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Bot health check passed')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # BDD
  db:
    container_name: postgres-discord-prod
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bots_api}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8
      POSTGRES_LOG_STATEMENT: all
      POSTGRES_LOG_DESTINATION: stderr
      POSTGRES_LOG_TIMESTAMP: on
      POSTGRES_LOG_LINE_PREFIX: '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
    networks:
      - app-network
    ports:
      - "127.0.0.1:5433:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bots_api}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

# RÉSEAUX 
networks:
  app-network:
    name: discord-bot-prod-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# VOLUMES 
volumes:
  # Base de données
  postgres_data:
    name: discord-postgres-data-prod
    driver: local
