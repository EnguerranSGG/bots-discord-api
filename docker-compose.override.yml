version: '3.8'

services:
  # Override du service API existant pour le développement
  app-dev:
    environment:
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Commande simplifiée pour créer le répertoire logs et démarrer
    command: >
      sh -c "
        mkdir -p /app/logs &&
        npm run start:dev
      "
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 45s

  # Nouveau service pour le bot Discord
  bot-discord:
    container_name: bot-discord-dev
    build:
      context: ../bot-discord-onboarding
      dockerfile: Dockerfile.dev
    env_file:
      - ../bot-discord-onboarding/.env.dev
    volumes:
      - ../bot-discord-onboarding:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      app-dev:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - API_URL=http://app-dev:3000
    # Commande pour démarrer le bot en mode développement
    command: >
      sh -c "
        mkdir -p /app/logs &&
        npm run dev
      "

  # Service de base de données partagée
  db:
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bots_api}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bots_api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  bot_logs:
    driver: local 