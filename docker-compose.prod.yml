services:
  # API NestJS (HTTP interne seulement)
  api:
    container_name: api-discord-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: api-discord:prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    command: sh -c "node dist/src/common/services/seed.service.js && node dist/src/main.js"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs/api:/app/logs
      - ./logs/api:/var/log/api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Nginx Reverse Proxy
  nginx:
    container_name: nginx-discord-prod
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # BOT ONBOARDING
  bot:
    container_name: bot-discord-prod
    build:
      context: ../bot-discord-onboarding
      dockerfile: Dockerfile.prod
    image: bot-discord:prod
    restart: unless-stopped
    env_file:
      - ../bot-discord-onboarding/.env.production
    environment:
      - NODE_ENV=production
      - API_URL=http://api:3000
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./logs/bot:/app/logs
      - ./logs/bot:/var/log/bot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Bot health check passed')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # BDD - PostgreSQL
  db:
    container_name: postgres-discord-prod
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bots_api}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
    networks:
      - app-network
    ports:
      - "127.0.0.1:5433:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bots_api}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Service de rotation des logs
  logrotate:
    image: alpine:latest
    container_name: logrotate-prod
    volumes:
      - ./logs:/logs
      - ./scripts/logrotate:/etc/logrotate.d:ro
    command: >
      sh -c "
        apk add --no-cache logrotate &&
        chmod 644 /etc/logrotate.d/* &&
        logrotate -f /etc/logrotate.d/api-logs &&
        logrotate -f /etc/logrotate.d/bot-logs &&
        logrotate -f /etc/logrotate.d/nginx-logs &&
        logrotate -f /etc/logrotate.d/postgres-logs
      "
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'

# RÉSEAUX - Isolation et sécurité
networks:
  app-network:
    name: discord-bot-prod-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# VOLUMES - Persistance des données
volumes:
  # Base de données
  postgres_data:
    name: discord-postgres-data-prod
    driver: local
